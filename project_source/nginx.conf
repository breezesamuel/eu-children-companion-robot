upstream node_app {
    server backend:3000;
}

upstream spring_app {
    server management-backend:8080;
}

upstream mcp_app {
    server mcp-server:8000;
}

upstream python_app {
    server python-api:8888;
}

server {
    listen 80;
    server_name robobuddy.eu api.robobuddy.eu;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name robobuddy.eu;

    ssl_certificate /etc/ssl/certs/robobuddy.crt;
    ssl_certificate_key /etc/ssl/private/robobuddy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /management/ {
        proxy_pass http://spring_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp/ {
        proxy_pass http://mcp_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://node_app;
        proxy_set_header Host $host;
    }

    # Python FastAPI routes — all 21 modules
    location ~ ^/api/(auth|conversation|education|emotional|growth|device|security|sync|stages|edge-ai|langchain|langgraph|recommend|analytics|notifications|parental|metrics|webhooks|search|audit|files|sessions|i18n|scheduler|docs/ws/stats|health|ping) {
        proxy_pass http://python_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Python WebSocket — real-time robot telemetry & chat
    location /ws {
        proxy_pass http://python_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /ws/ {
        proxy_pass http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React SPA served by Python FastAPI
    location /console/ {
        proxy_pass http://python_app/console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
