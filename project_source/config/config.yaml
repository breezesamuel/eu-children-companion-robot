app:
  name: "European Children Companion Robot"
  version: "5.0.0"
  description: "AI-powered companion robot with multi-terminal management: Robot, Parent Mobile, Management Center"

# Color Theme Configuration
# Disabled: white, black
# Enabled: red, yellow, earth-yellow, orange, purple, brown, coffee
color_theme:
  primary: "#8B4513"     # brown - 棕色
  secondary: "#D2691E"   # coffee - 咖啡色
  accent: "#FF8C00"      # orange - 橙色
  warning: "#FFD700"     # yellow - 黄色
  danger: "#DC143C"      # red - 红色
  earth: "#CD853F"       # earth-yellow - 土黄色
  purple: "#800080"      # purple - 紫色
  background: "#DEB887"  # wheat (light brown/coffee)
  surface: "#F5DEB3"     # wheat1 (light earth-yellow)
  text: "#4A3728"        # dark brown
  border: "#A0522D"      # sienna (brown variant)
  success: "#DA70D6"     # orchid (purple variant)

# Three-Terminal Architecture Configuration
terminals:
  robot:
    enabled: true
    description: "Robot terminal - Physical device for children interaction"
    role: "child_interaction"
    capabilities:
      - learning_tools          # 100+ learning assistance tools
      - home_devices            # 100+ smart home devices control
      - children_services       # 50+ children services platforms
      - english_platforms       # 50+ English learning platforms
      - entertainment
      - health_monitor
      - emotion_interaction
      - voice_assistant
  
  mobile:
    parents:
      enabled: true
      description: "Mobile terminal for parents - Remote control and monitoring"
      role: "parent_control"
      capabilities:
        - robot_control         # Control robot functions
        - learning_progress     # View children's learning progress
        - activity_monitor      # Monitor children's activities
        - schedule_management   # Manage daily schedules
        - message_center        # Receive notifications and messages
        - device_settings       # Configure robot settings
        - emergency_contact     # Emergency contact functions
  
  management_center:
    enabled: true
    description: "Central management platform - Monitor and control all terminals"
    role: "admin"
    managed_terminals:
      - robot                   # Manage robot devices
      - mobile_parents          # Manage parent mobile accounts
      - school                  # Manage school connections
    capabilities:
      - device_management       # Manage all robot devices
      - user_management         # Manage parent/school accounts
      - school_integration      # Integrate with schools
      - data_analytics          # Analytics dashboard
      - system_monitoring       # Real-time system monitoring
      - alert_management        # Alert and notification management
  
  school:
    enabled: true
    description: "School terminal - Educational institution integration"
    role: "education_partner"
    capabilities:
      - curriculum_sync         # Sync school curriculum
      - homework_assignment     # Assign homework tasks
      - progress_reporting      # Report learning progress
      - communication           # Communicate with parents
      - educational_resources   # Share educational materials

robot:
  device_id: "robot_default"
  name: "Little Joy"
  default_wake_word: "Robot Robot"
  fallback_wake_word: "小乐小乐"
  
  audio:
    sample_rate: 16000
    channels: 1
    chunk_size: 1024
    max_duration: 30
  
  edge_ai:
    model_path: "./models/"
    local_model: "TinyLlama-1.1B"
    max_memory_mb: 2048
    inference_timeout_ms: 500
  
  skills:
    enabled:
      - education
      - entertainment
      - control
      - emotion
      - health

# AI Framework Integration - GitHub Resources
ai_frameworks:
  langchain:
    enabled: true
    description: "AI agent framework - Tool calling, memory, Middleware"
    capabilities:
      - tool_calling
      - memory
      - middleware
      - chains
      - agents
      - document_loaders
      - embeddings
      - vectorstores
  
  langgraph:
    enabled: true
    description: "Graph-driven workflow engine"
    capabilities:
      - state_graph
      - workflow
      - agent_coordination
      - multi_agent
      - async_execution
  
  autognpt:
    enabled: true
    description: "Autonomous AI agent"
    capabilities:
      - self_directed
      - task_planning
      - execution
      - reflection
      - goal_oriented
  
  n8n:
    enabled: true
    description: "Workflow automation platform (157k stars)"
    capabilities:
      - workflow_builder
      - 1000+ nodes
      - automation
      - integrations
      - scheduling
  
  selenium:
    enabled: true
    description: "Browser automation framework"
    capabilities:
      - web_scraping
      - test_automation
      - form_filling
      - browser_control
  
  playwright:
    enabled: true
    description: "Modern browser automation"
    capabilities:
      - multi_browser
      - headless
      - mobile_emulation
      - network_interception
  
  scrapegraphai:
    enabled: true
    description: "AI-powered web scraping"
    capabilities:
      - intelligent_scraping
      - llm_enhanced
      - structured_output
      - multi_page

