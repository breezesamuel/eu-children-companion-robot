        function generateMathQuestions(count, type, level = 'random') {
            const questions = [];
            for (let i = 0; i < count; i++) {
                let num1, num2, answer, question;
                switch (type) {
                    case 'addition':
                        num1 = Math.floor(Math.random() * (level === 'single' ? 10 : level === 'two' ? 100 : 1000)) + 1;
                        num2 = Math.floor(Math.random() * (level === 'single' ? 10 : level === 'two' ? 100 : 1000)) + 1;
                        answer = num1 + num2;
                        question = `${num1} + ${num2} = ?`;
                        break;
                    case 'subtraction':
                        num1 = Math.floor(Math.random() * (level === 'single' ? 10 : level === 'two' ? 100 : 1000)) + 1;
                        num2 = Math.floor(Math.random() * num1) + 1;
                        answer = num1 - num2;
                        question = `${num1} - ${num2} = ?`;
                        break;
                    case 'multiplication':
                        num1 = Math.floor(Math.random() * 12) + 1;
                        num2 = Math.floor(Math.random() * 12) + 1;
                        answer = num1 * num2;
                        question = `${num1} × ${num2} = ?`;
                        break;
                    case 'division':
                        num2 = Math.floor(Math.random() * 12) + 1;
                        answer = Math.floor(Math.random() * 12) + 1;
                        num1 = num2 * answer;
                        question = `${num1} ÷ ${num2} = ?`;
                        break;
                    default:
                        const ops = ['+', '-', '×', '÷'];
                        const op = ops[Math.floor(Math.random() * ops.length)];
                        num1 = Math.floor(Math.random() * 50) + 1;
                        num2 = Math.floor(Math.random() * 50) + 1;
                        if (op === '+') answer = num1 + num2;
                        else if (op === '-') { num1 = Math.max(num1, num2); num2 = Math.min(num1, num2); answer = num1 - num2; }
                        else if (op === '×') answer = num1 * num2;
                        else { num1 = num1 * num2; answer = num2; }
                        question = `${num1} ${op} ${num2} = ?`;
                }
                questions.push({ id: i + 1, question, answer, type });
            }
            return questions;
        }

        function showCategoryDetail(category) {

                alert('Category not found!');
                return;
            }
            
            document.getElementById('detailIcon').textContent = data.icon;
            document.getElementById('detailTitle').textContent = data.name;
            
            const activityList = document.getElementById('activityList');
            activityList.innerHTML = '';
            
            data.activities.forEach((activity, index) => {
                const item = document.createElement('div');
                item.className = 'activity-item';
                item.style.cssText = 'background: #FFF8DC; border-left: 4px solid #8B4513;';
                item.innerHTML = `
                    <div class="activity-icon">${activity.icon}</div>
                    <div class="activity-name">${activity.name}</div>
                    <div class="activity-desc">${activity.desc}</div>
                    <div class="activity-count">${activity.subCount} ${currentLanguage === 'zh' ? '项' : 'items'}</div>
                `;
                item.onclick = () => openActivity(activity);
                activityList.appendChild(item);
            });
            
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('detailPanel').style.display = 'block';
            document.getElementById('categoryGrid').style.display = 'none';
            document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth' });
        }

                    showMathActivity(activity);
                    break;
                case 'vocabulary':

                    break;
                case 'grammar':
                    showGrammarActivity();
                    break;
                case 'biology':
                case 'chemistry':
                case 'physics':
                case 'geology':
                case 'astronomy':
                    showScienceActivity(activity.type);
                    break;
                case 'bedtime':
                case 'castle':
                case 'dragon':
                    showStoriesActivity(activity.type);
                    break;
                case 'rhymes':
                case 'instruments':
                case 'singing':
                case 'classical':

                    break;
                case 'shapes':
                    showShapesActivity();
                    break;
                case 'measurement':
                    showMeasurementActivity();
                    break;
                case 'drawing':
                case 'painting':
                case 'crafts':
                case 'drama':
                case 'sculpture':

                    break;

        function showMathActivity(activity) {
            const questions = generateMathQuestions(5, activity.mathType);
            let html = `<h3 style="color: #8B4513; margin-bottom: 20px;">${activity.icon} ${activity.name}</h3>`;
            
            questions.forEach((q, index) => {
                html += `
                    <div class="content-item" style="background: #FFF8DC; border-radius: 15px; padding: 15px; margin: 10px 0;">
                        <div class="question-number">${index + 1}.</div>
                        <div class="question-text">${q.question}</div>
                        <input type="number" class="answer-input" id="answer-${q.id}" placeholder="答案">
                        <button class="check-btn" onclick="checkMathAnswer(${q.id}, ${q.answer})">检查</button>
                        <span class="feedback" id="feedback-${q.id}"></span>
                    </div>
                `;
            });
            
            html += `<button class="start-btn" onclick="showMathActivity(currentActivity)" style="margin-top: 20px;">🔄 更多题目</button>`;
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function checkMathAnswer(id, correct) {
            const input = document.getElementById('answer-' + id);
            const feedback = document.getElementById('feedback-' + id);
            const userAnswer = parseInt(input.value);
            
            if (userAnswer === correct) {
                feedback.textContent = ' ✅ 正确！';
                feedback.style.color = 'green';
                input.style.borderColor = 'green';
            } else {
                feedback.textContent = ` ❌ 答案是: ${correct}`;
                feedback.style.color = 'red';
                input.style.borderColor = 'red';
            }
        }

                            <div class="fact-number">${index + 1}</div>

                                <div class="fact-text">${fact.fact}</div>
                            </div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function showStoriesActivity(type) {
            const stories = getLocalStories().filter(s => s.category === type);
            let html = `<h3 style="color: #8B4513; margin-bottom: 20px;">📖 ${type} 故事</h3>`;
            
            if (stories.length === 0) {
                const allStories = getLocalStories();
                html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">';
                allStories.slice(0, 6).forEach(story => {
                    html += `
                        <div class="content-item" style="background: #FFFACD; border-radius: 15px; padding: 20px; cursor: pointer;" onclick="showStoryDetail('${story.title.replace(/'/g, "\\'")}')">
                            <div class="story-icon">📚</div>
                            <div class="story-info">
                                <div class="story-title">${story.title}</div>
                                <div style="font-size: 13px; color: #8B4513;">${story.level} | ${story.duration}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                stories.forEach(story => {
                    html += `
                        <div class="content-item" style="background: #FFFACD; border-radius: 15px; padding: 20px; cursor: pointer;" onclick="showStoryDetail('${story.title.replace(/'/g, "\\'")}')">
                            <div class="story-icon">📚</div>
                            <div class="story-info">
                                <div class="story-title">${story.title}</div>
                                <div style="font-size: 13px; color: #8B4513;">${story.level} | ${story.duration}</div>
                            </div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function showStoryDetail(title) {
            const stories = getLocalStories();
            const story = stories.find(s => s.title === title);
            if (!story) return;
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;';
            modal.innerHTML = `
                <div style="background: white; padding: 30px; border-radius: 20px; max-width: 700px; max-height: 85vh; overflow-y: auto;">
                    <h2 style="color: #8B4513; margin-bottom: 10px;">${story.title}</h2>
                    <p style="color: #666; margin-bottom: 20px;">${story.level} | ${story.duration}</p>
                    <div style="white-space: pre-wrap; line-height: 1.8; font-size: 16px; margin-bottom: 20px;">${story.content}</div>
                    <button onclick="this.closest('div').parentElement.remove()" style="padding: 12px 30px; background: #8B4513; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; margin-right: 10px;">关闭</button>
                    <button onclick="speakText('${story.content.replace(/'/g, "\\'").replace(/\n/g, ' ')}')" style="padding: 12px 30px; background: #FF8C00; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">🔊 朗读</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showMusicActivity(type) {
            const songs = getLocalSongs();
            let html = '<h3 style="color: #8B4513; margin-bottom: 20px;">🎵 儿歌</h3>';
            
            songs.slice(0, 8).forEach((song, index) => {
                html += `
                    <div class="content-item" style="background: #E6E6FA; border-radius: 15px; padding: 15px; margin: 10px 0;">
                        <div class="song-icon">🎵</div>
                        <div class="song-info">
                            <div class="song-title">${song.title}</div>
                            <div class="song-lyrics">${song.lyrics.substring(0, 100)}...</div>
                        </div>
                        <button class="play-btn" onclick="speakText('${song.title}. ${song.lyrics}')">🎧</button>
                    </div>
                `;
            });
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function showShapesActivity() {
            const shapes = getLocalShapes();
            let html = '<h3 style="color: #8B4513; margin-bottom: 20px;">🔺 几何图形</h3>';
            
            html += '<h4 style="color: #D2691E; margin-top: 15px;">2D 图形:</h4><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">';
            shapes['2D']?.slice(0, 8).forEach(shape => {
                html += `
                    <div style="background: #FFFAF0; padding: 15px; border-radius: 10px; text-align: center;">
                        <div style="font-size: 40px;">⬜</div>
                        <div style="font-weight: bold; margin-top: 8px;">${shape.name}</div>
                        <div style="font-size: 12px; color: #8B4513;">边: ${shape.sides}</div>
                    </div>
                `;
            });
            html += '</div>';
            
            html += '<h4 style="color: #D2691E; margin-top: 20px;">3D 图形:</h4><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">';
            shapes['3D']?.slice(0, 8).forEach(shape => {
                html += `
                    <div style="background: #FAEBD7; padding: 15px; border-radius: 10px; text-align: center;">
                        <div style="font-size: 40px;">📦</div>
                        <div style="font-weight: bold; margin-top: 8px;">${shape.name}</div>
                        <div style="font-size: 12px; color: #8B4513;">面: ${shape.faces}</div>
                    </div>
                `;
            });
            html += '</div>';
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function showMeasurementActivity() {
            const units = getLocalMeasurement();
            let html = '<h3 style="color: #8B4513; margin-bottom: 20px;">📏 测量单位</h3>';
            
            ['length', 'weight', 'volume', 'time'].forEach(type => {
                if (units[type]) {
                    html += `<h4 style="color: #D2691E; margin-top: 15px;">${type.charAt(0).toUpperCase() + type.slice(1)}:</h4>`;
                    html += '<div style="display: flex; flex-wrap: wrap; gap: 10px;">';
                    units[type].slice(0, 6).forEach(unit => {
                        html += `<div style="background: #F5DEB3; padding: 10px 15px; border-radius: 8px;">
                            <strong>${unit.name}</strong> (${unit.symbol})
                            <div style="font-size: 12px; color: #666;">${unit.example}</div>
                        </div>`;
                    });
                    html += '</div>';
                }
            });
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function showArtsActivity(type) {
            const artsData = {
                drawing: { title: '🖌️ 绘画', content: '学习绘制各种有趣的图案和角色！\n\n绘画技巧：\n1. 先画轮廓\n2. 再填颜色\n3. 最后加细节' },
                painting: { title: '🎨 油画和水彩', content: '探索色彩的世界！\n\n水彩技巧：\n1. 先湿画纸\n2. 再上颜色\n3. 等待自然干' },
                crafts: { title: '✂️ 手工制作', content: '用纸张和材料创作！\n\n手工项目：\n1. 折纸艺术\n2. 纸飞机\n3. 贺卡制作' },
                drama: { title: '🎭 戏剧表演', content: '学习表演和表达！\n\n戏剧练习：\n1. 角色扮演\n2. 表情练习\n3. 声音模仿' },
                sculpture: { title: '🗿 雕塑', content: '用黏土创造三维作品！\n\n雕塑步骤：\n1. 揉捏黏土\n2. 塑造形状\n3. 添加细节' }
            };
            
            const data = artsData[type] || { title: '🎨 艺术', content: '发挥你的创意！' };
            
            document.getElementById('contentArea').innerHTML = `
                <h3 style="color: #8B4513; margin-bottom: 20px;">${data.title}</h3>
                <div style="background: #FFF0F5; padding: 25px; border-radius: 15px; white-space: pre-wrap; line-height: 1.8;">
                    ${data.content}
                </div>
            `;
        }

        // ==================== 语音功能 ====================

        function toggleVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('chatInput').value = transcript;
                    sendMessage();
                };
                
                recognition.start();
                showNotification('正在听... 请说话', 'info');
            } else {
                showNotification('您的浏览器不支持语音识别', 'info');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en-US';
                utterance.rate = 0.85;
                speechSynthesis.speak(utterance);
            }
        }

        // ==================== 聊天功能 ====================

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const messages = document.getElementById('chatMessages');
            
            messages.innerHTML += `
                <div class="chat-message user" style="margin-bottom: 10px; padding: 10px 15px; border-radius: 15px; max-width: 75%; margin-left: auto; background: #800080; color: white;">
                    ${message}
                </div>
            `;
            
            const response = generateResponse(message);
            
            setTimeout(() => {
                messages.innerHTML += `
                    <div class="chat-message bot" style="margin-bottom: 10px; padding: 10px 15px; border-radius: 15px; max-width: 75%; background: #FFF8DC; border: 1px solid #A0522D;">
                        🤖 ${response}
                    </div>
                `;
                messages.scrollTop = messages.scrollHeight;
            }, 500);
            
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }

        function generateResponse(message) {
            const msg = message.toLowerCase();
            const responses = {
                zh: {
                    math: ['数学很有趣！让我们做些加法练习吧！🧮', '你想学加法、减法、乘法还是除法？'],
                    english: ['英语学习很重要！你想学词汇还是语法？🔤', '多练习说英语，你会越来越棒的！'],
                    science: ['科学真奇妙！你想探索什么？🔬', '物理、化学、生物...你想学哪个？'],
                    story: ['故事时间！想听什么故事？📖', '我有很多有趣的故事哦！'],
                    hello: ['你好！今天想学习什么？🤖', '嗨！我是你的学习伙伴！'],
                    help: ['我可以帮你学习数学、英语、科学、故事等！', '输入你想学的内容，我会帮助你！']
                },
                en: {
                    math: ['Math is fun! Let\'s practice some addition! 🧮', 'Would you like addition, subtraction, multiplication or division?'],
                    english: ['English is important! Want to learn vocabulary or grammar? 🔤', 'Keep practicing, you\'ll get better!'],
                    science: ['Science is amazing! What do you want to explore? 🔬', 'Physics, chemistry, biology... which one?'],
                    story: ['Story time! What kind of story? 📖', 'I have many interesting stories!'],
                    hello: ['Hello! What would you like to learn today? 🤖', 'Hi! I\'m your learning companion!'],
                    help: ['I can help you with math, English, science, stories and more!', 'Tell me what you want to learn!']
                }
            };
            
            const lang = currentLanguage === 'zh' ? 'zh' : 'en';
            const r = responses[lang];
            
            if (msg.includes('数学') || msg.includes('math')) return r.math[Math.floor(Math.random() * r.math.length)];
            if (msg.includes('英语') || msg.includes('english')) return r.english[Math.floor(Math.random() * r.english.length)];
            if (msg.includes('科学') || msg.includes('science')) return r.science[Math.floor(Math.random() * r.science.length)];
            if (msg.includes('故事') || msg.includes('story')) return r.story[Math.floor(Math.random() * r.story.length)];
            if (msg.includes('你好') || msg.includes('hello') || msg.includes('hi')) return r.hello[Math.floor(Math.random() * r.hello.length)];
            if (msg.includes('帮助') || msg.includes('help')) return r.help[Math.floor(Math.random() * r.help.length)];
            
            return lang === 'zh' 
                ? '好主意！让我们一起学习吧！有什么特别想学的吗？'
                : 'Great idea! Let\'s learn together! Is there something specific you want to learn?';
        }

        // ==================== 通知系统 ====================

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // ==================== 初始化 ====================

        document.addEventListener('DOMContentLoaded', () => {
            changeLanguage('zh');
            initCategoryData();
        });
    </script>

                <div class="count">200000+ 活动</div>
            </div>
            <div class="category-card" data-category="engineering" onclick="showCategoryDetail('engineering')">
                <div class="icon">⚙️</div>
                <div class="name">工程</div>
                <div class="description">设计和构建</div>
                <div class="count">200000+ 项目</div>
            </div>
            <div class="category-card" data-category="arts" onclick="showCategoryDetail('arts')">
                <div class="icon">🎨</div>
                <div class="name">艺术</div>
                <div class="description">创意和设计</div>
                <div class="count">150000+ 项目</div>
            </div>
            <div class="category-card" data-category="story" onclick="showCategoryDetail('story')">
                <div class="icon">📖</div>
                <div class="name">故事</div>
                <div class="description">有趣的故事</div>
                <div class="count">50000+ 故事</div>
            </div>
            <div class="category-card" data-category="music" onclick="showCategoryDetail('music')">
                <div class="icon">🎵</div>
                <div class="name">音乐</div>
                <div class="description">歌曲和节奏</div>
                <div class="count">30000+ 歌曲</div>
            </div>
        </div>
        
        <div class="detail-panel" id="detailPanel">
            <div class="detail-header">
                <div class="icon" id="detailIcon">📚</div>
                <h2 id="detailTitle">类别详情</h2>
                <button class="back-btn" id="backBtn" onclick="hideDetailPanel()">← 返回</button>
            </div>
            <div class="activity-list" id="activityList"></div>
            <div class="content-area" id="contentArea"></div>
        </div>
        
        <div class="chat-section">
            <div class="chat-title" id="chatTitle">💬 和我聊天</div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message bot">
                    你好！我是你的学习伙伴机器人。今天想学习什么呢？
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
</body>
</html>
