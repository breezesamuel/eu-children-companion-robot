<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboBuddy Voice Assistant</title>
<style>
:root {
  --bg: #0a0f1e; --surface: #111827; --surface2: #1e293b; --surface3: #334155;
  --primary: #3b82f6; --primary-glow: rgba(59,130,246,.3);
  --accent: #10b981; --accent-glow: rgba(16,185,129,.3);
  --gold: #f59e0b; --text: #f1f5f9; --muted: #64748b; --border: #1e293b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.header { padding:.75rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:1rem; flex-shrink:0; flex-wrap:wrap; }
.header h1 { font-size:1.15rem; background:linear-gradient(90deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.status-badge { display:flex; align-items:center; gap:6px; font-size:.75rem; padding:3px 10px; border-radius:20px; background:var(--surface2); margin-left:auto; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:all .3s; }
.status-dot.active { background:var(--accent); animation:pulse 1.5s infinite; }
.status-dot.thinking { background:var(--gold); animation:pulse .6s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
.header-actions { display:flex; gap:6px; align-items:center; }
.header-actions button, .header-actions a { padding:4px 12px; border-radius:16px; font-size:.73rem; text-decoration:none; color:var(--text); border:1px solid var(--border); background:transparent; cursor:pointer; transition:all .2s; }
.header-actions button:hover, .header-actions a:hover { border-color:var(--primary); background:var(--surface2); }
.header-actions button.active { border-color:var(--accent); color:var(--accent); }
.main-layout { flex:1; display:flex; overflow:hidden; }
.chat-col { flex:1; display:flex; flex-direction:column; min-width:0; }
.video-col { width:280px; min-width:200px; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; transition:width .3s; position:relative; }
.video-col.hidden { width:0; min-width:0; border-left:none; overflow:hidden; }
.video-container { flex:1; position:relative; background:#000; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:200px; }
.video-container video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
.robot-avatar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:bold; color:#fff; box-shadow:0 0 20px var(--primary-glow); transition:all .3s; }
.robot-avatar.speaking { animation:avatarPulse .8s infinite; }
.robot-avatar.listening { box-shadow:0 0 30px var(--accent-glow); }
@keyframes avatarPulse { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.1)} }
.robot-eyes { display:flex; gap:12px; }
.robot-eye { width:14px; height:14px; border-radius:50%; background:#fff; animation:blink 3s infinite; }
.robot-eye.speaking { animation:blink .2s infinite; }
@keyframes blink { 0%,45%,55%,100%{opacity:1;transform:scaleY(1)} 50%{transform:scaleY(.1);opacity:.7} }
.video-controls { padding:8px; display:flex; gap:6px; justify-content:center; border-top:1px solid var(--border); }
.video-controls button { padding:6px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; font-size:.72rem; transition:all .2s; }
.video-controls button:hover { border-color:var(--primary); }
.video-controls button.on { border-color:var(--accent); background:rgba(16,185,129,.15); }
.video-col-header { padding:8px 12px; font-size:.75rem; color:var(--muted); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; }
.video-col-header .cam-dot { width:5px; height:5px; border-radius:50%; background:var(--muted); }
.video-col-header .cam-dot.on { background:var(--accent); animation:pulse 2s infinite; }
.module-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:.65rem; background:var(--surface3); color:var(--gold); margin-left:6px; }
.chat-area { flex:1; overflow-y:auto; padding:1rem 1.5rem; display:flex; flex-direction:column; gap:.6rem; }
.msg { max-width:92%; padding:.7rem 1rem; border-radius:14px; line-height:1.55; font-size:.88rem; animation:fadeIn .3s ease; white-space:pre-wrap; word-wrap:break-word; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:var(--surface2); border-bottom-left-radius:4px; }
.msg.system { align-self:center; background:var(--surface3); font-style:italic; font-size:.8rem; opacity:.8; }
.msg .time { font-size:.62rem; opacity:.5; margin-top:4px; display:block; }
.msg .intent-tag { display:inline-block; font-size:.62rem; padding:1px 8px; border-radius:8px; margin-top:4px; background:var(--surface3); color:var(--accent); }
.msg .module-tag { display:inline-block; font-size:.62rem; padding:1px 8px; border-radius:8px; margin-top:4px; margin-left:4px; background:var(--surface3); color:var(--gold); }
.followups { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.followup-btn { padding:4px 10px; border-radius:12px; border:1px solid var(--border); background:var(--surface3); color:var(--muted); cursor:pointer; font-size:.72rem; transition:all .2s; white-space:nowrap; }
.followup-btn:hover { border-color:var(--primary); color:var(--text); background:var(--surface2); }
.typing { align-self:flex-start; display:flex; gap:3px; padding:.7rem 1rem; background:var(--surface2); border-radius:14px; border-bottom-left-radius:4px; }
.typing span { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
.input-area { padding:.6rem 1rem; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:.5rem; align-items:flex-end; }
.input-area textarea { flex:1; padding:.55rem .75rem; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:.85rem; resize:none; outline:none; font-family:inherit; min-height:36px; max-height:100px; }
.input-area textarea:focus { border-color:var(--primary); }
.input-area button { padding:.55rem 1.2rem; border:none; border-radius:10px; background:var(--primary); color:#fff; cursor:pointer; font-size:.82rem; transition:all .2s; white-space:nowrap; }
.input-area button:hover { background:#2563eb; }
.input-area button:disabled { background:var(--surface3); color:var(--muted); cursor:not-allowed; }
.controls { padding:.5rem 1rem 0; background:var(--surface); display:flex; align-items:center; justify-content:center; gap:.75rem; flex-shrink:0; flex-wrap:wrap; }
.mic-btn { width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.4rem; transition:all .3s; position:relative; }
.mic-btn.idle { background:var(--primary); color:#fff; box-shadow:0 3px 15px var(--primary-glow); }
.mic-btn.idle:hover { transform:scale(1.08); }
.mic-btn.listening { background:var(--accent); color:#fff; box-shadow:0 3px 20px var(--accent-glow); animation:micPulse 1.5s infinite; }
.mic-btn.speaking { background:var(--gold); color:#fff; box-shadow:0 3px 20px rgba(245,158,11,.4); animation:micPulse 1.5s infinite; }
@keyframes micPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.audio-level { width:120px; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
.audio-level-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--primary)); border-radius:2px; transition:width .1s; }
.intent-hint { font-size:.68rem; color:var(--muted); text-align:center; padding:.2rem 1rem .4rem; background:var(--surface); }
.welcome { text-align:center; padding:2rem 1rem; color:var(--muted); }
.welcome .logo { width:72px; height:72px; margin:0 auto .5rem; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:bold; color:#fff; }
.welcome h2 { color:var(--text); font-size:1.05rem; margin-bottom:.3rem; }
.welcome p { font-size:.8rem; line-height:1.5; }
.welcome .suggestions { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:10px; }
.welcome .suggestions button { padding:5px 12px; border:1px solid var(--border); border-radius:14px; background:var(--surface2); color:var(--text); cursor:pointer; font-size:.75rem; transition:all .2s; }
.welcome .suggestions button:hover { border-color:var(--primary); background:var(--surface3); }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }
@media(max-width:800px){ .video-col { width:200px; } }
@media(max-width:650px){ .video-col { display:none; } .chat-area { padding:.6rem .8rem; } .msg { max-width:98%; font-size:.84rem; } }
</style>
</head>
<body>
<div class="header">
  <h1>RoboBuddy</h1>
  <span class="status-badge"><span class="status-dot" id="statusDot"></span><span id="statusText">Starting...</span></span>
  <span id="historyBadge" style="font-size:.7rem;color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:12px;display:none">0 msgs</span>
  <div class="header-actions">
    <button id="continuousMode" onclick="toggleMode()">Continuous</button>
    <button id="videoToggle" onclick="toggleVideo()">Camera</button>
    <a href="learning-center.html">Library</a>
  </div>
</div>

<div class="main-layout">
  <div class="chat-col">
    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="logo">RB</div>
        <h2>RoboBuddy Voice Assistant</h2>
        <p id="welcomeStatus">Loading...</p>
        <div class="suggestions">
          <button onclick="quickSend('Hello')">Say Hello</button>
          <button onclick="quickSend('Teach me about dinosaurs')">Dinosaurs</button>
          <button onclick="quickSend('Tell me about the solar system')">Space</button>
          <button onclick="quickSend('What is artificial intelligence')">AI</button>
          <button onclick="quickSend('Tell me a fun fact')">Fun Fact</button>
          <button onclick="quickSend('Quiz me')">Quiz</button>
          <button onclick="quickSend('New vocabulary')">Words</button>
          <button onclick="quickSend('Tell me a story')">Story</button>
        </div>
      </div>
    </div>
    <div class="intent-hint" id="intentHint">Listening... speak anytime or type below</div>
    <div class="controls">
      <div class="audio-level"><div class="audio-level-bar" id="audioLevel"></div></div>
      <button class="mic-btn listening" id="micBtn" onclick="toggleMic()" title="Hold Space to speak">&#x1F3A4;</button>
    </div>
    <div class="input-area">
      <textarea id="chatInput" rows="1" placeholder="Type a message and press Enter..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="video-col" id="videoCol">
    <div class="video-col-header"><span class="cam-dot" id="camDot"></span> Camera <span class="module-badge" id="moduleBadge" style="display:none"></span></div>
    <div class="video-container" id="videoContainer">
      <video id="userVideo" autoplay playsinline muted></video>
      <div class="robot-avatar" id="robotAvatar">
        <div class="robot-eyes">
          <div class="robot-eye" id="robotEyeL"></div>
          <div class="robot-eye" id="robotEyeR"></div>
        </div>
      </div>
    </div>
    <div class="video-controls">
      <button id="camBtn" class="on" onclick="toggleCam()">Camera On</button>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────
const chatArea = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const intentHint = document.getElementById('intentHint');
const micBtn = document.getElementById('micBtn');
const audioLevelBar = document.getElementById('audioLevel');
const moduleBadge = document.getElementById('moduleBadge');
const robotAvatar = document.getElementById('robotAvatar');
const robotEyeL = document.getElementById('robotEyeL');
const robotEyeR = document.getElementById('robotEyeR');
const userVideo = document.getElementById('userVideo');
const camBtn = document.getElementById('camBtn');
const camDot = document.getElementById('camDot');
const videoCol = document.getElementById('videoCol');

let isListening = false;
let isContinuousMode = true;
let isCameraOn = false;
let isVideoVisible = true;
let recognition = null;
let camStream = null;
let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2,6);
let isSpeaking = false;
let finalTranscript = '';

// ─── Speech Recognition ───────────────────────────────────────────
try {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTranscript += t + ' ';
          showAudioLevel(true);
          setTimeout(() => showAudioLevel(false), 300);
        } else {
          interim = t;
        }
      }
      chatInput.value = (finalTranscript + interim).trim();
      chatInput.scrollTop = chatInput.scrollHeight;
    };

    recognition.onend = () => {
      const text = chatInput.value.trim();
      if (text && isContinuousMode && !isSpeaking) {
        chatInput.value = '';
        sendUserMessage(text);
        finalTranscript = '';
      }
      if (isContinuousMode && isListening) {
        try { recognition.start(); } catch(_) {}
      }
    };

    recognition.onerror = (e) => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        if (isContinuousMode) {
          setTimeout(() => { if (!isListening) try { recognition.start(); isListening = true; micBtn.className = 'mic-btn listening'; } catch(_) {} }, 500);
        }
      }
    };
  }
} catch(_) {}

// ─── Camera ───────────────────────────────────────────────────────
async function startCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
    userVideo.srcObject = camStream;
    isCameraOn = true;
    camBtn.textContent = 'Camera On';
    camBtn.className = 'on';
    camDot.className = 'cam-dot on';
  } catch(err) {
    isCameraOn = false;
    camBtn.textContent = 'Camera Offline';
    camBtn.disabled = true;
  }
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  userVideo.srcObject = null;
  isCameraOn = false;
  camBtn.textContent = 'Camera Off';
  camBtn.className = '';
  camDot.className = 'cam-dot';
}

function toggleCam() {
  if (isCameraOn) { stopCamera(); }
  else { startCamera(); }
}

function toggleVideo() {
  isVideoVisible = !isVideoVisible;
  videoCol.classList.toggle('hidden', !isVideoVisible);
  document.getElementById('videoToggle').className = isVideoVisible ? 'active' : '';
}

// ─── Audio Level ─────────────────────────────────────────────────
function showAudioLevel(active) {
  audioLevelBar.style.width = active ? Math.min(100, 20 + Math.random() * 60) + '%' : '0%';
}

// ─── Mode ─────────────────────────────────────────────────────────
function toggleMode() {
  isContinuousMode = !isContinuousMode;
  document.getElementById('continuousMode').className = isContinuousMode ? 'active' : '';
  intentHint.textContent = isContinuousMode
    ? 'Listening... speak anytime or type below'
    : 'Tap the mic to speak, tap again to stop';
  if (isContinuousMode && recognition && !isListening) {
    startListening();
  } else if (!isContinuousMode && isListening) {
    stopListening();
  }
}

// ─── Mic ──────────────────────────────────────────────────────────
function startListening() {
  if (!recognition) return;
  isListening = true;
  micBtn.className = 'mic-btn listening';
  setStatus('active', 'Listening');
  recognition.lang = 'en-US';
  recognition.continuous = true;
  try { recognition.start(); } catch(_) {}
}

function stopListening() {
  isListening = false;
  micBtn.className = 'mic-btn idle';
  setStatus('active', 'Idle');
  if (recognition) try { recognition.stop(); } catch(_) {}
}

function toggleMic() {
  if (!recognition) { addMessage('Speech recognition not available. Use Chrome.', 'bot'); return; }
  if (isListening) { stopListening(); return; }
  startListening();
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.repeat) {
    e.preventDefault();
    if (!isListening && recognition) startListening();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    if (isListening && !isContinuousMode) {
      const text = chatInput.value.trim();
      chatInput.value = '';
      finalTranscript = '';
      stopListening();
      if (text) sendUserMessage(text);
    }
  }
});

// ─── Send ─────────────────────────────────────────────────────────
async function sendMessage() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = '';
  finalTranscript = '';
  await sendUserMessage(msg);
}

async function sendUserMessage(msg) {
  if (!msg) return;
  addMessage(msg, 'user');
  setStatus('thinking', 'Thinking...');
  sendBtn.disabled = true;
  showTyping();
  robotAvatar.className = 'robot-avatar speaking';
  robotEyeL.className = 'robot-eye speaking';
  robotEyeR.className = 'robot-eye speaking';
  try {
    removeTyping();
    const reply = generateLocalReply(msg);
    addMessage(reply, 'bot', 'conversation', null, []);
    speak(reply);
    setStatus('active', 'Listening');
    robotAvatar.className = 'robot-avatar listening';
    robotEyeL.className = 'robot-eye';
    robotEyeR.className = 'robot-eye';
  } catch(err) {
    removeTyping();
    addMessage('Sorry, something went wrong. Please try again.', 'bot');
    setStatus('active', 'Listening');
    robotAvatar.className = 'robot-avatar listening';
  }
  sendBtn.disabled = false;
  chatInput.focus();
}

function generateLocalReply(msg) {
  const m = msg.toLowerCase();
  if (m.includes('hello') || m.includes('hi') || m.includes('hey')) return 'Hello! I\'m your learning companion. What would you like to learn today?';
  if (m.includes('math') || m.includes('add') || m.includes('subtract')) return 'Math is fun! I can help you with addition, subtraction, multiplication, and division. What would you like to practice?';
  if (m.includes('english') || m.includes('vocab') || m.includes('word')) return 'English is important! I have 120+ vocabulary words and 50+ grammar rules. Would you like to learn new words or practice grammar?';
  if (m.includes('science') || m.includes('biology') || m.includes('physics')) return 'Science is amazing! I can teach you about biology, chemistry, physics, geology, and astronomy. What topic interests you?';
  if (m.includes('story') || m.includes('stories')) return 'I love stories! I have bedtime stories, castle stories, dragon tales, and adventure stories. Which type would you like to hear?';
  if (m.includes('music') || m.includes('song') || m.includes('sing')) return 'Music is wonderful! I know nursery rhymes, classical music, and can teach you about instruments. What would you like to explore?';
  if (m.includes('help')) return 'I can help you with: Math, English, Science, Technology, Engineering, Arts, Stories, and Music. Just tell me what you\'re interested in!';
  if (m.includes('thank')) return 'You\'re welcome! Keep learning and exploring. I\'m always here to help!';
  if (m.includes('bye') || m.includes('goodbye')) return 'Goodbye! Come back anytime to learn more. Have a great day!';
  return 'That\'s a great question! I can help you with math, English, science, stories, music, and more. What would you like to learn about?';
}

// ─── UI Helpers ───────────────────────────────────────────────────
function label(i) {
  return { greeting:'Greeting', help:'Help', vocab:'Vocabulary', quiz:'Quiz', math:'Math',
    search:'Search', conversation:'Chat', default:'Chat', error:'Error', module:'Module',
    learn:'Learning', science:'Science', story:'Story' }[i] || i;
}

function addMessage(text, role, intent, module, followups) {
  const w = document.getElementById('welcome');
  if (w) w.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const time = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
  let html = text.replace(/\n/g, '<br>');
  if (intent) html += '<br><span class="intent-tag">' + label(intent) + '</span>';
  if (module) html += '<span class="module-tag">' + module.charAt(0).toUpperCase() + module.slice(1) + '</span>';
  html += '<span class="time">' + time + '</span>';
  div.innerHTML = html;
  chatArea.appendChild(div);
  if (role === 'bot' && followups && followups.length > 0) {
    const fDiv = document.createElement('div');
    fDiv.className = 'followups';
    followups.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'followup-btn';
      btn.textContent = f;
      btn.onclick = () => { chatInput.value = f; sendMessage(); };
      fDiv.appendChild(btn);
    });
    chatArea.appendChild(fDiv);
  }
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typingInd';
  d.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(d);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingInd');
  if (el) el.remove();
}

function setStatus(state, labelText) {
  statusDot.className = 'status-dot' + (state === 'active' ? ' active' : state === 'thinking' ? ' thinking' : '');
  statusText.textContent = labelText;
}

function quickSend(text) {
  chatInput.value = text; sendMessage();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '').replace(/[^\w\s.,!?'-]/g, '').trim().substring(0, 200);
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.1;
  isSpeaking = true;
  micBtn.className = 'mic-btn speaking';
  robotAvatar.className = 'robot-avatar speaking';
  robotEyeL.className = 'robot-eye speaking';
  robotEyeR.className = 'robot-eye speaking';
  u.onend = () => {
    isSpeaking = false;
    micBtn.className = isListening ? 'mic-btn listening' : 'mic-btn idle';
    robotAvatar.className = 'robot-avatar listening';
    robotEyeL.className = 'robot-eye';
    robotEyeR.className = 'robot-eye';
  };
  u.onerror = () => {
    isSpeaking = false;
    micBtn.className = isListening ? 'mic-btn listening' : 'mic-btn idle';
    robotAvatar.className = 'robot-avatar listening';
    robotEyeL.className = 'robot-eye';
    robotEyeR.className = 'robot-eye';
  };
  window.speechSynthesis.speak(u);
}

// ─── Status ───────────────────────────────────────────────────────
async function refreshStatus() {
  try {
    const welcomeEl = document.getElementById('welcomeStatus');
    if (welcomeEl) {
      welcomeEl.innerHTML = `120+ words &middot; 50+ lessons &middot; 8 topics<br>I search my database, the web, and can answer across history, geography, biology, physics, chemistry, coding and more!`;
    }
  } catch(_) {}
}

// ─── Init ─────────────────────────────────────────────────────────
async function init() {
  setStatus('active', 'Starting...');
  await refreshStatus();

  await startCamera();

  if (recognition) {
    isListening = true;
    try { recognition.start(); } catch(_) {}
    micBtn.className = 'mic-btn listening';
    setStatus('active', 'Listening');
  }

  refreshStatus();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
