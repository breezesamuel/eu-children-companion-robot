<!DOCTYPE html>

<head>

    <script>

    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF8DC 0%, #FFFAF0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .robot {
            font-size: 80px;
            animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        h1 { color: #8B4513; margin-top: 20px; }
        p { color: #666; font-size: 16px; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 6px 20px rgba(139, 69, 19, 0.3);
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.4);
        }
        .features {
            margin-top: 30px;
            text-align: left;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .features ul {
            list-style: none;
            padding: 0;
        }
        .features li {
            padding: 10px 0;
            color: #4A3728;
        }
        .features li:before {
            content: '✨';
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="robot">🤖</div>

                <li>8大学习模块，50+具体活动</li>
                <li>AI语音对话和朗读功能</li>

                <li>数学练习、故事阅读、音乐、科学等全面覆盖</li>
