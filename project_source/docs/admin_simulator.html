<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Center Simulator - Children Companion Robot</title>
<style>
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --sidebar-bg: #1e1e2d;
  --sidebar-hover: #2a2a3d;
  --sidebar-active: #323248;
  --sidebar-text: #a2a3b7;
  --sidebar-text-active: #ffffff;
  --content-bg: #f5f5f9;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-secondary: #6c757d;
  --border: #e0e0e0;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --info: #3498db;
  --accent: var(--primary);
  --header-height: 64px;
  --sidebar-width: 250px;
}
.dark {
  --sidebar-bg: #0f0f1a;
  --sidebar-hover: #1a1a2e;
  --sidebar-active: #252540;
  --sidebar-text: #8888a0;
  --sidebar-text-active: #ffffff;
  --content-bg: #12121e;
  --card-bg: #1a1a2e;
  --text: #e0e0e0;
  --text-secondary: #9999b0;
  --border: #2a2a40;
  --primary: #4dabf7;
  --primary-dark: #339af0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  min-height: 100vh;
  background: var(--content-bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
}
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  position: fixed;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: background 0.3s;
}
.sidebar-logo {
  padding: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 700;
  color: var(--sidebar-text-active);
}
.sidebar-logo .logo-icon { font-size: 28px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--sidebar-text);
  text-decoration: none;
  font-size: 14px;
  border-left: 3px solid transparent;
}
.sidebar-nav-item:hover {
  background: var(--sidebar-hover);
  color: var(--sidebar-text-active);
}
.sidebar-nav-item.active {
  background: var(--sidebar-active);
  color: var(--sidebar-text-active);
  border-left-color: var(--primary);
}
.sidebar-nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 12px;
}
.main-content {
  margin-left: var(--sidebar-width);
  flex: 1;
  min-height: 100vh;
  transition: margin 0.3s;
}
.topbar {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  transition: background 0.3s;
}
.topbar-left { display: flex; align-items: center; gap: 20px; }
.topbar-left h2 { font-size: 18px; font-weight: 600; }
.mode-switch {
  display: flex;
  background: var(--content-bg);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}
.mode-btn {
  padding: 6px 16px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.mode-btn.active {
  background: var(--primary);
  color: #fff;
}
.mode-btn:not(.active):hover { color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-right .btn-icon {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 18px;
  padding: 6px;
  border-radius: 6px;
  transition: all 0.2s;
}
.topbar-right .btn-icon:hover { background: var(--content-bg); color: var(--text); }
.theme-toggle { font-size: 18px; }
.user-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--content-bg);
  border-radius: 8px;
  font-size: 13px;
}
.user-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
}
.content-area { padding: 30px; }

/* Page sections */
.page-section { display: none; }
.page-section.active { display: block; }

/* Stats cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
.stat-card .stat-icon { font-size: 28px; margin-bottom: 8px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; }
.stat-card .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.stat-card .stat-change {
  font-size: 12px;
  margin-top: 8px;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
}
.stat-change.up { background: rgba(39,174,96,0.12); color: var(--success); }
.stat-change.down { background: rgba(231,76,60,0.12); color: var(--danger); }

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
.grid-2-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

/* Cards */
.card {
  background: var(--card-bg);
  border-radius: 12px;
  border: 1px solid var(--border);
  transition: background 0.3s;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-header h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
th { font-weight: 600; color: var(--text-secondary); background: var(--card-bg); }
td { color: var(--text); }
tr:hover td { background: rgba(26,115,232,0.03); }

/* Badges */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge-success { background: rgba(39,174,96,0.12); color: var(--success); }
.badge-warning { background: rgba(243,156,18,0.12); color: var(--warning); }
.badge-danger { background: rgba(231,76,60,0.12); color: var(--danger); }
.badge-info { background: rgba(52,152,219,0.12); color: var(--info); }
.badge-secondary { background: rgba(108,117,125,0.12); color: var(--text-secondary); }
.badge-sm { padding: 2px 8px; font-size: 10px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--content-bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Forms */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--card-bg);
  color: var(--text);
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
}
.form-textarea { min-height: 80px; resize: vertical; }

/* Filters bar */
.filters-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  flex-wrap: wrap;
}
.filters-bar .form-input, .filters-bar .form-select { width: auto; min-width: 150px; }
.filters-bar .btn { margin-left: auto; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: 16px;
  width: 90%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-secondary);
}
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* Activity feed */
.activity-feed { list-style: none; max-height: 400px; overflow-y: auto; }
.activity-item {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.activity-item:last-child { border-bottom: none; }
.activity-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.activity-text { flex: 1; font-size: 13px; }
.activity-text strong { font-weight: 600; }
.activity-time { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }

/* Quick actions */
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Health bars */
.health-item { margin-bottom: 12px; }
.health-item:last-child { margin-bottom: 0; }
.health-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.health-bar {
  height: 8px;
  background: var(--content-bg);
  border-radius: 4px;
  overflow: hidden;
}
.health-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s;
}

/* CSS Bar Charts */
.css-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 180px;
  padding: 10px 0;
}
.css-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.css-bar-fill {
  width: 100%;
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height 0.8s;
}
.css-bar-label { font-size: 10px; color: var(--text-secondary); text-align: center; }
.css-bar-value { font-size: 11px; font-weight: 600; }

/* Inline content */
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.text-secondary { color: var(--text-secondary); }
.text-center { text-align: center; }
.mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.w-full { width: 100%; }

/* Toast */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 14px 20px;
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 280px;
  max-width: 400px;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-warning { background: var(--warning); }
.toast-info { background: var(--info); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-close { margin-left: auto; cursor: pointer; background: none; border: none; color: rgba(255,255,255,0.8); font-size: 16px; }

/* Details panel */
.detail-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-top: 16px;
}
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.detail-item {}
.detail-item .detail-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.detail-item .detail-value { font-size: 14px; font-weight: 500; margin-top: 2px; }

/* Tabbed content */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.tab {
  padding: 10px 18px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.panel-content { max-height: 400px; overflow-y: auto; }
.robot-list { list-style: none; }
.robot-list li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.robot-list li:last-child { border-bottom: none; }

/* Breadcrumb-style separator */
.sep { color: var(--text-secondary); margin: 0 6px; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

@media (max-width: 1024px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-2-equal { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-logo span:not(.logo-icon), .sidebar-nav-item span:not(.nav-icon), .sidebar-footer { display: none; }
  .sidebar-nav-item { justify-content: center; padding: 12px; }
  .main-content { margin-left: 60px; }
  .topbar { padding: 0 16px; }
  .content-area { padding: 16px; }
  .stats-grid { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">🤖</span>
    <span>Admin Simulator</span>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-item active" data-page="dashboard">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </div>
    <div class="sidebar-nav-item" data-page="robots">
      <span class="nav-icon">🤖</span><span>Robot Management</span>
    </div>
    <div class="sidebar-nav-item" data-page="users">
      <span class="nav-icon">👥</span><span>User Management</span>
    </div>
    <div class="sidebar-nav-item" data-page="content">
      <span class="nav-icon">📚</span><span>Content Management</span>
    </div>
    <div class="sidebar-nav-item" data-page="analytics">
      <span class="nav-icon">📈</span><span>Analytics & Reports</span>
    </div>
    <div class="sidebar-nav-item" data-page="settings">
      <span class="nav-icon">⚙️</span><span>System Settings</span>
    </div>
    <div class="sidebar-nav-item" data-page="alerts">
      <span class="nav-icon">🔔</span><span>Alert Center</span>
    </div>
    <div class="sidebar-nav-item" data-page="audit">
      <span class="nav-icon">📋</span><span>Audit Log</span>
    </div>
  </nav>
  <div class="sidebar-footer">
    <div>v2.0.0 · System Online</div>
    <div style="margin-top:4px;font-size:11px;color:var(--success);">● Connected</div>
  </div>
</div>

<div class="main-content">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="central">Central Admin</button>
        <button class="mode-btn" data-mode="school">School Admin</button>
      </div>
    </div>
    <div class="topbar-right">
      <span id="wsIndicator" style="font-size:12px;color:var(--success);">● Live</span>
      <button class="btn-icon" onclick="refreshAll()" title="Refresh">🔄</button>
      <button class="btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
      <div class="user-badge">
        <span class="user-avatar">A</span>
        <span><strong id="userRoleLabel">Central Admin</strong><br><span class="text-secondary" style="font-size:11px;">admin@companion.io</span></span>
      </div>
    </div>
  </div>
  <div class="content-area" id="contentArea"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ========== SIMULATED DATA ==========
const SIM = {
  robots: [],
  users: [],
  content: { categories: [], items: [], sources: [] },
  events: [],
  alerts: [],
  auditLog: []
};

function initSimData() {
  const schools = ['Berlin International School', 'Paris Lycée Français', 'London Academy', 'Madrid Colegio Central', 'Rome Scuola Italia', 'Amsterdam International'];
  const states = ['online','offline','charging','error','sleeping'];
  const owners = ['parent1@mail.com','parent2@mail.com','parent3@mail.com','parent4@mail.com','parent5@mail.com'];

  for (let i = 1; i <= 48; i++) {
    SIM.robots.push({
      id: `RB-${String(1000 + i).slice(1)}`,
      name: `Companion-${String(i).padStart(2,'0')}`,
      state: states[Math.floor(Math.random()*states.length)],
      battery: Math.floor(Math.random()*100),
      owner: owners[Math.floor(Math.random()*owners.length)],
      school: schools[Math.floor(Math.random()*schools.length)],
      lastActive: `${Math.floor(Math.random()*59)+1}m ago`,
      firmware: `v2.${Math.floor(Math.random()*5)}.${Math.floor(Math.random()*10)}`,
      ip: `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`,
      cpuTemp: `${(Math.random()*20+40).toFixed(1)}°C`,
      uptime: `${Math.floor(Math.random()*720)+1}h`,
      children: [`Child ${String.fromCharCode(65+i)}`, `Child ${String.fromCharCode(70+i)}`]
    });
  }

  const roles = ['admin','school_admin','parent'];
  for (let i = 1; i <= 20; i++) {
    SIM.users.push({
      id: i,
      name: `User ${i}`,
      email: `user${i}@companion.io`,
      role: roles[Math.floor(Math.random()*roles.length)],
      status: Math.random() > 0.15 ? 'active' : 'suspended',
      created: new Date(Date.now() - Math.random()*365*24*60*60000).toISOString().slice(0,10),
      school: schools[Math.floor(Math.random()*schools.length)],
      subscriptions: ['low_battery','offline','error'],
      loginHistory: [
        { time: '2h ago', ip: '10.0.1.1', device: 'Chrome/Windows' },
        { time: '1d ago', ip: '10.0.1.1', device: 'Safari/iOS' }
      ]
    });
  }

  SIM.content.categories = ['Mathematics','Language Arts','Science','Social Studies','Music','Art','Physical Education','AI Ethics'];
  const wordsList = [1200, 8500, 3400, 2100, 4100, 2800, 1500, 950];
  const itemsList = [8, 12, 6, 5, 7, 4, 3, 6];
  SIM.content.categories.forEach((cat,i) => {
    SIM.content.items.push({ category: cat, count: itemsList[i], totalWords: wordsList[i], lastUpdated: new Date(Date.now()-Math.random()*30*24*60*60000).toISOString().slice(0,10) });
  });

  SIM.content.sources = [
    { url: 'https://kids.nationalgeographic.com', status: 'active', lastCrawl: '2h ago', itemsScraped: 156 },
    { url: 'https://www.ducksters.com', status: 'active', lastCrawl: '5h ago', itemsScraped: 89 },

// ========== API SIMULATION ==========
async function apiCall(method, path, body) {
  const baseUrl = window.location.origin;
  const url = `${baseUrl}/api/admin${path}`;
  try {
    const opts = { method, headers: { 'Content-Type':'application/json', 'Authorization':'Bearer sim-token' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    return await res.json();
  } catch(e) {
    // Simulated fallback
    return { success: true, simulated: true, message: 'Simulated response (server unavailable)' };
  }
}

function showToast(message, type='success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `<span>${message}</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>`;
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
}

function openModal(title, bodyHtml, footerHtml='') {
  document.getElementById('modalTitle').textContent = title;

}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

function renderContentBrowser() {
  const cat = document.getElementById('contentCatFilter').value;
  const q = document.getElementById('contentSearch').value.toLowerCase();
  const container = document.getElementById('contentBrowserBody');
  let items = [];
  const titles = ['Addition Basics','Grammar Fun','Solar System','World Geography','Music Notes','Color Theory','Team Sports','AI for Kids'];
  SIM.content.categories.forEach((c,i) => {
    for (let j = 0; j < (SIM.content.items[i]?.count||3); j++) {
      const match = (!cat || c === cat) && (!q || titles[i].toLowerCase().includes(q));
      if (match) items.push({ category: c, title: `${titles[i]} - Lesson ${j+1}`, type: ['lesson','quiz','game','video'][j%4], words: Math.floor(Math.random()*500+100) });
    }
  });
  if (!items.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>No content found</div>'; return; }
  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Words</th><th>Actions</th></tr></thead>
        <tbody>${items.map(item => `<tr><td><strong>${item.title}</strong></td><td><span class="badge badge-info">${item.category}</span></td><td>${item.type}</td><td>${item.words}</td><td><button class="btn btn-xs btn-secondary">👁️ View</button><button class="btn btn-xs btn-primary" style="margin-left:4px;">✏️ Edit</button></td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;
}

function renderAlerts() {
  const types = [...new Set(SIM.alerts.map(a=>a.type))];
  const priorities = [...new Set(SIM.alerts.map(a=>a.priority))];

  document.getElementById('contentArea').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>🔔 Alert Center</h3>
        <div class="flex gap-8">
          <button class="btn btn-success btn-sm" onclick="batchResolveAlerts()">✅ Resolve Selected</button>

          <option value="">All Types</option>
          ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
        <select class="form-select" id="alertPriorityFilter" onchange="renderAlerts()">
          <option value="">All Priorities</option>
          ${priorities.map(p => `<option value="${p}">${p}</option>`).join('')}
        </select>
        <select class="form-select" id="alertStatusFilter" onchange="renderAlerts()">
          <option value="">All Status</option>
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
        </select>
        <input class="form-input" type="date" id="alertDateFrom" style="min-width:140px;">
        <input class="form-input" type="date" id="alertDateTo" style="min-width:140px;">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th><input type="checkbox" onchange="document.querySelectorAll('.alert-cb').forEach(c=>c.checked=this.checked)"></th>
            <th>Time</th><th>Type</th><th>Priority</th><th>Source</th><th>Message</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="alertTableBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card mt-16">
      <div class="card-header"><h3>⚙️ Alert Rules Configuration</h3></div>
      <div class="card-body">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Rule</th><th>Condition</th><th>Threshold</th><th>Action</th><th>Enabled</th></tr></thead>
            <tbody>
              <tr><td>Low Battery</td><td>battery < threshold</td><td>20%</td><td>Notify owner + school admin</td><td><span class="badge badge-success">Active</span></td></tr>
              <tr><td>Offline Timeout</td><td>state=offline > threshold</td><td>30 minutes</td><td>Escalate to admin</td><td><span class="badge badge-success">Active</span></td></tr>
              <tr><td>Error Rate Spike</td><td>errors/min > threshold</td><td>10</td><td>Page on-call engineer</td><td><span class="badge badge-warning">Paused</span></td></tr>
              <tr><td>Temperature Critical</td><td>cpu_temp > threshold</td><td>85°C</td><td>Auto-shutdown robot</td><td><span class="badge badge-success">Active</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  const tf = document.getElementById('alertTypeFilter').value;
  const pf = document.getElementById('alertPriorityFilter').value;
  const sf = document.getElementById('alertStatusFilter').value;
  const df = document.getElementById('alertDateFrom')?.value;
  const dt = document.getElementById('alertDateTo')?.value;

  const list = SIM.alerts.filter(a => {
    if (tf && a.type !== tf) return false;
    if (pf && a.priority !== pf) return false;
    if (sf && a.status !== sf) return false;
    if (df && new Date(a.time) < new Date(df)) return false;
    if (dt && new Date(a.time) > new Date(dt + 'T23:59:59')) return false;
    return true;
  });

  document.getElementById('alertTableBody').innerHTML = list.slice(0,30).map(a => {
    const pClass = { low:'badge-secondary', medium:'badge-info', high:'badge-warning', critical:'badge-danger' }[a.priority] || 'badge-secondary';
    const tClass = { info:'badge-info', warning:'badge-warning', error:'badge-danger', security:'badge-danger' }[a.type] || 'badge-secondary';
    return `<tr>
      <td><input type="checkbox" class="alert-cb" value="${a.id}"></td>
      <td>${timeAgo(a.time)}</td>
      <td><span class="badge ${tClass}">${a.type}</span></td>
      <td><span class="badge ${pClass}">${a.priority}</span></td>
      <td>${a.source}</td>
      <td>${a.message}</td>
      <td><span class="badge ${a.status==='open'?'badge-warning':'badge-success'}">${a.status}</span></td>
      <td>
        <button class="btn btn-xs btn-success" onclick="showToast('Alert ${a.id} resolved','success');renderAlerts()">✅</button>
        <button class="btn btn-xs btn-danger" onclick="showToast('Alert ${a.id} deleted','success');renderAlerts()">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

        <input class="form-input" type="date" id="auditDateFrom" style="min-width:140px;">
        <input class="form-input" type="date" id="auditDateTo" style="min-width:140px;">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Resource</th><th>Details</th><th>IP Address</th></tr></thead>
          <tbody id="auditTableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  const af = document.getElementById('auditActionFilter').value;
  const uf = document.getElementById('auditUserFilter').value.toLowerCase();
  const df = document.getElementById('auditDateFrom')?.value;
  const dt = document.getElementById('auditDateTo')?.value;

  const list = SIM.auditLog.filter(l => {
    if (af && l.action !== af) return false;
    if (uf && !l.user.toLowerCase().includes(uf)) return false;
    if (df && new Date(l.timestamp) < new Date(df)) return false;
    if (dt && new Date(l.timestamp) > new Date(dt + 'T23:59:59')) return false;
    return true;
  }).slice(0,50);

  document.getElementById('auditTableBody').innerHTML = list.map(l => `
    <tr>
      <td>${new Date(l.timestamp).toLocaleString()}</td>
      <td>${l.user}</td>
      <td><span class="badge badge-info">${l.action}</span></td>
      <td style="font-family:monospace;font-size:12px;">${l.resource}</td>
      <td>${l.details}</td>
      <td style="font-family:monospace;font-size:12px;">${l.ip}</td>
    </tr>
  `).join('');
}

function renderPage(page) {
  switch(page) {
    case 'dashboard': renderDashboard(); break;
    case 'robots': renderRobots(); break;
    case 'users': renderUsers(); break;
    case 'content': renderContent(); break;
    case 'analytics': renderAnalytics(); break;
    case 'settings': renderSettings(); break;
    case 'alerts': renderAlerts(); break;
    case 'audit': renderAudit(); break;
  }
}

// WebSocket simulation
let wsInterval;
function startWsSimulation() {
  wsInterval = setInterval(() => {
    const indicator = document.getElementById('wsIndicator');
    if (indicator) {
      indicator.style.color = wsConnected ? 'var(--success)' : 'var(--danger)';
      indicator.textContent = wsConnected ? '● Live' : '○ Disconnected';
    }
    // Simulate random disconnect/reconnect
    if (Math.random() > 0.97) {
      wsConnected = !wsConnected;
      if (wsConnected) {
        showToast('WebSocket reconnected', 'success');
        indicator.textContent = '● Live';
        indicator.style.color = 'var(--success)';
      } else {
        showToast('WebSocket disconnected', 'error');
        indicator.textContent = '○ Disconnected';
        indicator.style.color = 'var(--danger)';
      }
    }
  }, 5000);
}

function refreshAll() {
  showToast('Refreshing all data...', 'info');
  setTimeout(() => renderPage(currentPage), 300);
}

// Init
navigateTo('dashboard');
startWsSimulation();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
