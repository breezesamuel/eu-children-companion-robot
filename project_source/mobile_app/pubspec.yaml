name: robot_companion_app
description: A Flutter app for European Children Companion Robot management
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  provider: ^6.0.5
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  mqtt_client: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.68.0
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/languages/

