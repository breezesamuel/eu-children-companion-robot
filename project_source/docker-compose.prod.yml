version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robot_db
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-robot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://robot:${DB_PASSWORD:-robot123}@postgres:5432/robot_db
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      LOG_LEVEL: info
      CORS_ORIGINS: https://robobuddy.eu,https://admin.robobuddy.eu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  management-backend:
    build:
      context: ./management_center/backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/robot_db
      SPRING_DATASOURCE_USERNAME: robot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-robot123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  management-frontend:
    build:
      context: ./management_center/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

  python-api:
    build:
      context: ..
      dockerfile: Dockerfile.python
    environment:
      PYTHONIOENCODING: utf-8
      TZ: Europe/Berlin
      LOG_LEVEL: info
      # Hidden 24/7 autonomous ops -- backend only, never exposed to frontend
      ENABLE_HIDDEN_API: "${ENABLE_HIDDEN_API:-false}"
      AUTONOMOUS_INTERNAL_KEY: "${AUTONOMOUS_INTERNAL_KEY:-}"
      AUTONOMOUS_AUTOSTART: "${AUTONOMOUS_AUTOSTART:-1}"
      AUTONOMOUS_INTERVAL: "300"
      AUTONOMOUS_STATE_BACKEND: "redis"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis123}@redis:6379"
    ports:
      - "127.0.0.1:8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html:ro
      - ./ssl:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - management-backend
      - management-frontend
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
