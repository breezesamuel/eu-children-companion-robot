version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL (Production Database)
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: robot-postgres
    environment:
      POSTGRES_DB: robot_prod
      POSTGRES_USER: ${POSTGRES_USER:-robot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robot} -d robot_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Redis (Cache, Rate Limiting, Sessions)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: robot-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────
  # Node.js Backend (project_source/server.js)
  # ──────────────────────────────────────────────────────────────────────────
  node-api:
    build:
      context: ./project_source
      dockerfile: ../Dockerfile.node
    container_name: robot-node-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-robot}:${POSTGRES_PASSWORD}@postgres:5432/robot_prod
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ROBOT_STAGE: production
      TRUST_PROXY: "1"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW: "60000"
      RATE_LIMIT_BURST: "20"
      MAX_BODY_SIZE: "1mb"
      ROBOT_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.children-robot.com,https://parent.children-robot.com}
      # Security
      MFA_ISSUER: RobotCare
      MFA_EPOCH_TOLERANCE: "30"
      # External APIs
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_TOKEN: ${FACEBOOK_APP_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Python FastAPI Services (children_robot_system.py)
  # ──────────────────────────────────────────────────────────────────────────
  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: robot-python-api
    environment:
      ROBOT_STAGE: production
      PORT: 8888
      DATABASE_URL: postgresql://${POSTGRES_USER:-robot}:${POSTGRES_PASSWORD}@postgres:5432/robot_prod
      REDIS_URL: redis://redis:6379
      ROBOT_JWT_SECRET: ${JWT_SECRET}
      ROBOT_JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ROBOT_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.children-robot.com,https://parent.children-robot.com}
      ROBOT_AUTH_ENFORCED: "1"
      ROBOT_DB_POOL_SIZE: "10"
      ROBOT_DEBUG: "0"
      # Classroom / LTI
      CLASSROOM_CLIENT_ID: ${CLASSROOM_CLIENT_ID}
      CLASSROOM_CLIENT_SECRET: ${CLASSROOM_CLIENT_SECRET}
      CLASSROOM_REDIRECT_URI: ${CLASSROOM_REDIRECT_URI}
      CLASSROOM_PROJECT_ID: ${CLASSROOM_PROJECT_ID}
      CLASSROOM_WEBHOOK_URL: ${CLASSROOM_WEBHOOK_URL}
      # COPPA / DSA
      COPPA_WEBHOOK_URL: ${COPPA_WEBHOOK_URL}
      DSA_WEBHOOK_URL: ${DSA_WEBHOOK_URL}
      # Edge AI
      EDGE_AI_MODELS_DIR: /app/models
      EDGE_AI_DELEGATE: rknpu
      # Hidden 24/7 autonomous ops -- backend only, never exposed to frontend
      ENABLE_HIDDEN_API: "${ENABLE_HIDDEN_API:-false}"
      AUTONOMOUS_INTERNAL_KEY: "${AUTONOMOUS_INTERNAL_KEY:-}"
      AUTONOMOUS_AUTOSTART: "${AUTONOMOUS_AUTOSTART:-1}"
      AUTONOMOUS_INTERVAL: "300"
      HUNTER_ONLINE: "${HUNTER_ONLINE:-0}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      AUTONOMOUS_STATE_BACKEND: "redis"
    ports:
      - "8888:8888"
    volumes:
      - ./models:/app/models:ro
      - python_data:/app/data
      - python_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # ──────────────────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy (TLS Termination, Rate Limiting, WAF)
  # ──────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: robot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - node-api
      - python-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ──────────────────────────────────────────────────────────────────────────
  # Certbot (Automatic TLS Certificates)
  # ──────────────────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: robot-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    depends_on:
      - nginx

  # ──────────────────────────────────────────────────────────────────────────
  # Prometheus (Metrics Collection)
  # ──────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: robot-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ──────────────────────────────────────────────────────────────────────────
  # Grafana (Dashboards)
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.0
    container_name: robot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitoring.children-robot.com
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ──────────────────────────────────────────────────────────────────────────
  # Alertmanager (Alert Routing)
  # ──────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: robot-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ──────────────────────────────────────────────────────────────────────────
  # Loki (Log Aggregation)
  # ──────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: robot-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────
  # Promtail (Log Shipper)
  # ──────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: robot-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - python_logs:/app/logs:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ──────────────────────────────────────────────────────────────────────────
  # Jaeger (Distributed Tracing)
  # ──────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: robot-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - jaeger_data:/var/lib/jaeger
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  python_data:
  python_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  jaeger_data:

networks:
  default:
    name: robot-network
    driver: bridge