[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "children-companion-robot"
version = "1.0.0"
description = "European Children Companion Robot — Education, Growth, Emotional & Security Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Learning Companion Team", email = "team@children-robot.com"}
]
maintainers = [
    {name = "Security Team", email = "security@children-robot.com"}
]
keywords = [
    "education", "robot", "children", "ai", "edge-computing", "gdpr", "privacy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.34",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.8",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "cryptography==42.0.8",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.26.0",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-instrumentation-fastapi==0.46b0",
    "opentelemetry-instrumentation-sqlalchemy==0.46b0",
    "opentelemetry-instrumentation-redis==0.46b0",
    "opentelemetry-exporter-otlp==1.26.0",
    "python-json-logger==2.0.7",
    "httpx==0.27.2",
    "aiohttp==3.9.5",
    "email-validator==2.2.0",
    "pyyaml==6.0.1",
    "orjson==3.10.3",
    "apscheduler==3.10.4",
    "celery==5.4.0",
    "python-dotenv==1.0.1",
    "click==8.1.7",
    "tqdm==4.66.5",
    "tenacity==8.3.0",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "faker==27.4.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]
ml = [
    "onnxruntime==1.19.2",
    "tokenizers==0.20.1",
    "huggingface-hub==0.24.7",
    "opencv-python-headless==4.10.0.84",
    "torch==2.4.0",
    "transformers==4.44.0",
]
monitoring = [
    "grafana-client==1.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/children-companion-robot"
Repository = "https://github.com/your-org/children-companion-robot"
Issues = "https://github.com/your-org/children-companion-robot/issues"
Documentation = "https://docs.children-robot.com"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "UP", "W", "C4", "C90", "B", "A", "C4", "T20", "PI", "PT",
    "Q", "RUF", "SIM", "TID", "TRY", "PD", "PGH", "PL", "RET", "SLF", "SLOT",
    "TCH", "ARG", "PTH", "ERA", "NPY", "PERF", "FLY", "INP", "ISC", "ICN",
    "LOG", "TD", "PLE", "PLW", "PLR"
]
ignore = [
    "S101",
    "TRY003",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "T201"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "security: Security-related tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
# See .pre-commit-config.yaml for full config

[tool.setuptools.packages.find]
where = ["."]
include = ["children*", "project_source*"]
exclude = ["tests*", "scripts*", "docs*", "*.egg-info", "build", "dist"]