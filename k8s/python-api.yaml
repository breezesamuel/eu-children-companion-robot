apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-python-api
  namespace: robot-production
  labels:
    app: robot-python-api
    component: backend
    tier: general
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: robot-python-api
      tier: general
  template:
    metadata:
      labels:
        app: robot-python-api
        component: backend
        tier: general
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: robot-python-api
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values: ["general"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["robot-python-api"]
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "general"
          effect: "NoSchedule"
      containers:
        - name: robot-python-api
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/robot-python-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            - name: ROBOT_STAGE
              value: "production"
            - name: PORT
              value: "8888"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: robot-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: robot-secrets
                  key: REDIS_URL
            - name: ROBOT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: robot-secrets
                  key: JWT_SECRET
            - name: ROBOT_CORS_ORIGINS
              value: "https://app.children-robot.com,https://parent.children-robot.com"
            - name: ROBOT_AUTH_ENFORCED
              value: "1"
            - name: ROBOT_DB_POOL_SIZE
              value: "20"
            - name: EDGE_AI_MODELS_DIR
              value: "/app/models"
            - name: EDGE_AI_DELEGATE
              value: "cpu"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "robot-python-api"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "500Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8888
            failureThreshold: 60
            periodSeconds: 2
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: robot-models-pvc
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: robot-python-api
  namespace: robot-production
  labels:
    app: robot-python-api
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app: robot-python-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: robot-python-api
  namespace: robot-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: robot-python-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max