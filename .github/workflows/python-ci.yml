name: Python API CI

on:
  push:
    paths:
      - 'children_*.py'
      - 'requirements.txt'
      - 'requirements-python.txt'
      - 'Dockerfile.python'
      - '.github/workflows/python-ci.yml'
      - 'project_source/mcp_server/server.py'
  pull_request:
    paths:
      - 'children_*.py'
      - 'requirements.txt'
      - 'requirements-python.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the production image base (python:3.11-slim) so CI matches
          # the runtime exactly, including eager annotation evaluation.
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-python.txt
      - name: Annotation portability (3.11 eager evaluation)
        run: python scripts/check_annotations.py
      - name: Syntax check
        run: |
          import glob, sys
          files = sorted(glob.glob('children_*.py'))
          errors = 0
          for f in files:
            try:
              compile(open(f, encoding='utf-8').read(), f, 'exec')
              print(f'  OK  {f} ({len(open(f).read().splitlines())} lines)')
            except SyntaxError as e:
              print(f'  FAIL {f}: {e}')
              errors += 1
          print(f'\n{len(files)-errors}/{len(files)} syntax OK')
          sys.exit(errors)
        shell: python {0}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the production image base (python:3.11-slim) so CI matches
          # the runtime exactly, including eager annotation evaluation.
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-python.txt
      - name: Run unit tests
        run: python tests/test_all_unit.py

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the production image base (python:3.11-slim) so CI matches
          # the runtime exactly, including eager annotation evaluation.
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-python.txt
      - name: Run integration tests
        run: python tests/test_integration.py
      - name: Run security tests
        run: python tests/test_security_api.py
      - name: Run MCP server tests
        run: python tests/test_mcp_server.py
      - name: Run load tests
        run: python tests/load_test.py

  docker-build:
    needs: [lint, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-python-api:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-python-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
