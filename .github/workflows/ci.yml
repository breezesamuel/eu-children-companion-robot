name: CI / CD

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Lint & Type-check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: |
          pip install -q ruff mypy
          pip install -q -r requirements.txt 2>/dev/null || true
      - name: Ruff lint (correctness — blocking)
        run: ruff check . --select E9,F63,F7,F82
      - name: Ruff lint (full ruleset — advisory)
        run: ruff check . --exit-zero
      - name: Mypy type-check
        run: mypy --ignore-missing-imports children_*.py scripts/ || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: project_source/package-lock.json
      - name: Install Node deps
        run: cd project_source && npm ci
      - name: ESLint
        run: cd project_source && npm run lint 2>/dev/null || npx eslint . --ext .js,.jsx,.ts,.tsx

  # 2. Unit Tests (Python + Node)
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: pip install -q -r requirements.txt 2>/dev/null || true
      - name: Run Python unit tests
        run: python tests/test_all_unit.py
      - name: Run Python autonomous flow
        run: python tests/test_autonomous_flow.py
      - name: Run Python commerce flow
        run: python tests/test_commerce_flow.py
      - name: Run Python engagement flow
        run: python tests/test_engagement_flow.py
      - name: Run Python integrations
        run: python tests/test_integrations.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: project_source/package-lock.json
      - name: Install Node deps
        run: cd project_source && npm ci
      - name: Run Node tests
        run: cd project_source && node tests/run-all.js

  # 3. Security & Licence Gate
  licence-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: pip install -q -r requirements.txt 2>/dev/null || true
      - name: Run SOP licence gate
        run: python scripts/repo_check.py
      - name: Run SOP discovery audit
        run: python scripts/sop_discovery.py --offline || true

  # 4. Commercial Closure Audit
  closure-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python deps
        run: pip install -q -r requirements.txt 2>/dev/null || true
      - name: Run closure audit
        run: python scripts/closure_audit.py --json

  # 5. Build Docker Images
  build:
    runs-on: ubuntu-latest
    needs: [test, licence-gate, closure-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push python-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.python
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push node-api
        uses: docker/build-push-action@v5
        with:
          context: ./project_source
          file: ../Dockerfile.node
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/node-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/node-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:latest

  # 6. Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server via SSH..."
          # ssh deploy@staging.children-robot.com "cd /opt/robot && docker compose pull && docker compose up -d"
          echo "STAGING_DEPLOY=done"

  # 7. Deploy to Production (manual approval)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production server via SSH..."
          # ssh deploy@children-robot.com "cd /opt/robot && docker compose pull && docker compose up -d"
          echo "PRODUCTION_DEPLOY=done"

  # 8. Post-deploy smoke tests
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Smoke test production
        run: |
          echo "Running smoke tests against production..."
          # curl -f https://api.children-robot.com/health/live
          # curl -f https://app.children-robot.com
          echo "SMOKE_TEST=done"