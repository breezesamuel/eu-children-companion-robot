name: Docker image (ghcr.io)

# Builds the production image entirely in the cloud and pushes it to the
# GitHub Container Registry. No local Docker and no credit card are needed,
# and the resulting image can be pulled by any PaaS that accepts an image.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.cloud"
      - "requirements*.txt"
      - "children_*.py"
      - "cli.py"
      - "scripts/**"
      - "project_source/**"
      - ".github/workflows/docker-image.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (full image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (slim cloud image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cloud
          push: true
          tags: ghcr.io/${{ github.repository }}:slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Container images published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}:slim\`" >> "$GITHUB_STEP_SUMMARY"
