name: Live API (24-7 public)

# Hosts the FastAPI robot-companion service on a GitHub-hosted runner and
# exposes it on the public internet through a Cloudflare quick tunnel — no
# account, no credit card, no local machine.
#
# Resilience model: the cron fires every 30 minutes; each run serves for ~5h20m
# and scheduled runs are serialised (cancel-in-progress: false), so GitHub keeps
# exactly one run serving plus one pending. When a run ends — normally or on
# failure — the pending run takes over within seconds. Manual dispatches use a
# separate concurrency group so they run immediately.
#
# The current public URL is mirrored (force-pushed) to the `live-status` branch
# as live.json and picked up by the autonomous loop, which republishes it to
# GitHub Pages (/api/live.json + the /live/ front door). The URL is never
# fabricated: if the tunnel or the health check fails, the run fails.

on:
  schedule:
    # Frequent so a fresh run is always queued to take over on failure.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to serve before exiting (max 330)"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  # Separate group per event type: scheduled runs serialise (self-healing
  # supervisor), while a manual dispatch is never blocked behind a long run.
  group: live-api-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PORT: "8899"
      ROBOT_STAGE: production
      DEPLOYMENT_REGION: EU
      PYTHONUNBUFFERED: "1"
      SIMULATE_ENGAGEMENT: "1"
      # Run the 24/7 autonomous loop inside the live service itself, with durable
      # on-disk state, so /api/console/loop/{status,history} serve real,
      # continuously-updated telemetry (no internal key, read-only view).
      AUTONOMOUS_AUTOSTART: "1"
      AUTONOMOUS_INTERVAL: "300"
      AUTONOMOUS_STATE_BACKEND: "file"
      AUTONOMOUS_STATE_DIR: "runtime/autonomous_state"
      # Optional: set the ADMIN_PASSWORD secret to get a known admin login.
      # Unset -> the app seeds a random per-instance credential (never logged).
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      DATA_LOOP_SALT: ${{ secrets.DATA_LOOP_SALT }}
      PERSISTENCE_ENCRYPTION_KEY: ${{ secrets.PERSISTENCE_ENCRYPTION_KEY }}
      AUTONOMOUS_INTERNAL_KEY: ${{ secrets.AUTONOMOUS_INTERNAL_KEY }}
      # Hidden autonomous-ops backend (key-protected, not in OpenAPI)
      ENABLE_HIDDEN_API: "true"
      # --- paywall (10 free uses, then the subscription wall) ---
      PAYWALL_FREE_USES: "10"
      PAYWALL_DEFAULT_CURRENCY: "USD"
      PAYWALL_STATE_BACKEND: "file"
      # --- payment rails: blank PAYMENT_ADAPTER = explicit mock (no real charge).
      # Set the secret to paypal|moltspay AND provide the rail's credentials/URLs
      # to move real money; MoltsPay also needs MOLTSPAY_ORDER_URL + merchant keys.
      PAYMENT_ADAPTER: ${{ secrets.PAYMENT_ADAPTER }}
      MOLTSPAY_API_KEY: ${{ secrets.MOLTSPAY_API_KEY }}
      MOLTSPAY_SECRET: ${{ secrets.MOLTSPAY_SECRET }}
      MOLTSPAY_ORDER_URL: ${{ secrets.MOLTSPAY_ORDER_URL }}
      MOLTSPAY_STATUS_URL: ${{ secrets.MOLTSPAY_STATUS_URL }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
      SETTLEMENT_ALIPAY_ACCOUNT: ${{ secrets.SETTLEMENT_ALIPAY_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the operator console (/console)
        # The committed lockfile was generated on Windows and omits the Linux
        # rollup binary (npm/cli#4828), so `npm ci` fails on the runner. Resolve
        # fresh from package.json instead, which pulls the platform binary.
        run: |
          cd project_source/management_center/frontend
          rm -f package-lock.json
          npm install --no-audit --no-fund --include=optional
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements-python.txt

      - name: Start app + public tunnel
        run: |
          set -euo pipefail
          nohup python scripts/live_runner.py --port "${PORT}" --force \
            > live_runner.out 2>&1 &
          echo $! > live_runner.pid
          echo "supervisor pid=$(cat live_runner.pid)"

      - name: Wait for the public URL
        id: url
        run: |
          set -euo pipefail
          URL=""
          for i in $(seq 1 60); do
            if [ -f runtime/live_state.json ]; then
              URL=$(python - <<'PY'
          import json
          try:
              st = json.load(open("runtime/live_state.json", encoding="utf-8"))
              print((st.get("public_url") or "").strip())
          except Exception:
              print("")
          PY
          )
            fi
            if [ -n "$URL" ]; then break; fi
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "no public URL after 5 minutes"; tail -n 60 live_runner.out || true
            exit 1
          fi
          echo "LIVE_URL=$URL" >> "$GITHUB_ENV"
          echo "public url: $URL"

      - name: Verify the public endpoint is healthy
        run: |
          set -euo pipefail
          for path in /health/live /health/ready; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${LIVE_URL}${path}" || echo 000)
            echo "${path} -> ${code}"
          done
          curl -fsS --max-time 20 "${LIVE_URL}/health/live" | head -c 400
          echo

      - name: Mirror the endpoint to the live-status branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          st = json.load(open("runtime/live_state.json", encoding="utf-8"))
          doc = {
              "url": st.get("public_url"),
              "status": "up",
              "started_at": st.get("started_at"),
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "health_path": "/health/live",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "host": "github-actions · cloudflare-quick-tunnel",
          }
          os.makedirs("liveout", exist_ok=True)
          json.dump(doc, open("liveout/live.json", "w", encoding="utf-8"), indent=2)
          print(json.dumps(doc))
          PY
          cd liveout
          git init -q
          git checkout -q -b live-status
          git config user.name "robot-live[bot]"
          git config user.email "robot-live@users.noreply.github.com"
          git add -A
          git commit -q -m "live endpoint ${LIVE_URL} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-status
          echo "mirrored live.json -> branch live-status"

      - name: Serve and heartbeat
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MIN="${{ github.event.inputs.minutes }}"
          else
            MIN=320
          fi
          [ -z "$MIN" ] && MIN=20
          if [ "$MIN" -gt 330 ]; then MIN=330; fi
          END=$(( $(date +%s) + MIN * 60 ))
          REFRESH=$(( $(date +%s) + 900 ))
          FAILS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${LIVE_URL}/health/live" || echo 000)
            if [ "$CODE" != "200" ]; then
              FAILS=$((FAILS + 1))
              echo "$(date -u +%H:%M:%S) health ${CODE} (fails=${FAILS})"
              if [ "$FAILS" -ge 5 ]; then echo "endpoint unhealthy; exiting so the next run takes over"; exit 1; fi
            else
              FAILS=0
            fi
            if [ "$(date +%s)" -ge "$REFRESH" ]; then
              cd liveout
              python - <<'PY'
          import json, time, os
          doc = json.load(open("live.json", encoding="utf-8"))
          doc["updated_at"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          json.dump(doc, open("live.json", "w", encoding="utf-8"), indent=2)
          PY
              git add -A && git commit -q -m "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
              git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-status
              cd ..
              REFRESH=$(( $(date +%s) + 900 ))
            fi
            sleep 60
          done
          echo "served for ${MIN} minutes; exiting for the next run to take over"
