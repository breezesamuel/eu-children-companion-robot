name: Device Simulator (Telemetry Generator)

# Runs on GitHub-hosted runners which CAN reach the Cloudflare tunnel URLs.
# Generates realistic device telemetry -> Live API -> data_loop -> Retention Engine.

on:
  schedule:
    # Every 5 minutes during active hours (6am-10pm CET)
    - cron: "*/5 4-20 * * *"
  workflow_dispatch:
    inputs:
      device_count:
        description: "Number of simulated devices"
        required: false
        default: "3"
      duration_minutes:
        description: "How long to run (minutes)"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: "8899"
      ROBOT_STAGE: production
      DEPLOYMENT_REGION: EU
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements-python.txt

      - name: Get current Live API URL
        id: live_url
        run: |
          set -euo pipefail
          for i in {1..5}; do
            URL=$(curl -fsS "https://breezesamuel.github.io/eu-children-companion-robot/api/live.json" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))")
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "LIVE_URL=$URL" >> "$GITHUB_ENV"
              echo "Found live URL: $URL"
              break
            fi
            echo "Waiting for live URL... ($i/5)"
            sleep 10
          done
          if [ -z "$LIVE_URL" ] || [ "$LIVE_URL" = "null" ]; then
            echo "ERROR: Could not get live URL"
            exit 1
          fi

      - name: Run device simulator
        env:
          DEVICE_COUNT: ${{ github.event.inputs.device_count || '3' }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '5' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os, random, sys, time, uuid
          from datetime import datetime, timezone
          try:
              import websockets
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "websockets"])
              import websockets

          LIVE_URL = os.environ["LIVE_URL"]
          DEVICE_COUNT = int(os.environ.get("DEVICE_COUNT", "3"))
          DURATION = int(os.environ.get("DURATION_MINUTES", "5")) * 60
          WS_URL = LIVE_URL.replace("https://", "wss://").replace("http://", "ws://")

          # EU curriculum content IDs
          CONTENT_MAP = {
              "language_literacy": ["eu_de_phonics", "eu_de_vocab", "eu_fr_lecture"],
              "math_logic": ["eu_de_zahlen", "eu_fr_nombres", "eu_nl_rekenen"],
              "science_nature": ["eu_sci_junior", "eu_nature_explore", "eu_body_science"],
              "social_emotional": ["eu_emotions", "eu_friendship", "eu_empathy"],
              "music_movement": ["eu_music_early", "eu_rhythm", "eu_dance"],
              "stories_creativity": ["eu_story_early", "eu_creative_write", "eu_puppet"],
              "digital_safety": ["eu_online_safe", "eu_privacy_basics", "eu_cyber_kind"],
          }

          async def simulate_device(device_id: str, household_id: str):
              ws_url = f"{WS_URL}/ws/device/{device_id}"
              print(f"[{device_id}] Connecting to {ws_url}")
              try:
                  async with websockets.connect(ws_url, max_size=2**20) as ws:
                      # Send initial telemetry
                      await ws.send(json.dumps({
                          "type": "telemetry",
                          "device_id": device_id,
                          "data": {"battery": random.randint(70, 100), "wifi": random.randint(-60, -30)},
                          "timestamp": datetime.now(timezone.utc).isoformat()
                      }))
                      
                      end_time = time.time() + DURATION
                      while time.time() < end_time:
                          # Heartbeat every 30-60 seconds
                          await asyncio.sleep(random.uniform(30, 60))
                          if time.time() >= end_time:
                              break
                          
                          await ws.send(json.dumps({
                              "type": "telemetry",
                              "device_id": device_id,
                              "data": {"battery": max(10, random.randint(60, 100)), "wifi": random.randint(-65, -30)},
                              "timestamp": datetime.now(timezone.utc).isoformat()
                          }))
                          
                          # Occasionally send a lesson completion (10% chance per heartbeat)
                          if random.random() < 0.1:
                              subject = random.choice(list(CONTENT_MAP.keys()))
                              content_id = random.choice(CONTENT_MAP[subject])
                              minutes = random.randint(5, 25)
                              score = random.randint(40, 100)
                              completed = score >= 60
                              sentiment = "positive" if completed and score >= 80 else "neutral" if completed else "frustrated"
                              
                              await ws.send(json.dumps({
                                  "type": "lesson_complete",
                                  "device_id": device_id,
                                  "household_id": household_id,
                                  "child_id": f"child-{household_id}",
                                  "data": {
                                      "subject": subject,
                                      "content_id": content_id,
                                      "minutes": minutes,
                                      "score": score,
                                      "completed": completed,
                                      "sentiment": sentiment
                                  },
                                  "timestamp": datetime.now(timezone.utc).isoformat()
                              }))
                              print(f"[{device_id}] Sent lesson: {subject} ({minutes}min, score={score})")
              except Exception as e:
                  print(f"[{device_id}] Error: {e}")

          async def main():
              tasks = []
              for i in range(DEVICE_COUNT):
                  device_id = f"sim-{uuid.uuid4().hex[:8]}"
                  household_id = f"hh-sim-{i+1}"
                  tasks.append(simulate_device(device_id, household_id))
              await asyncio.gather(*tasks)

          asyncio.run(main())
          PY

      - name: Verify events were emitted
        run: |
          set -euo pipefail
          # Wait a bit for events to be processed
          sleep 10
          # Check data loop via retention summary
          RET_URL="${LIVE_URL}/api/retention/summary?days=1"
          for i in {1..3}; do
            RESP=$(curl -fsS "$RET_URL" || echo "{}")
            HOUSEHOLDS=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('households',0))")
            SESSIONS=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); print(sum(d.get('top_risk_households',[])))")
            echo "Retry $i: households=$HOUSEHOLDS"
            if [ "$HOUSEHOLDS" -gt 0 ]; then
              echo "SUCCESS: Device simulator generated $HOUSEHOLDS households with activity"
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: No households detected yet (may need more time)"