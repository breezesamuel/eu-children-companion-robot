global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'robot-production'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # ──────────────────────────────────────────────────────────────────────────
  # Prometheus self-monitoring
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ──────────────────────────────────────────────────────────────────────────
  # Node Exporter (Host metrics)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'docker-host'

  # ──────────────────────────────────────────────────────────────────────────
  # Node.js API (Express)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'node-api'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['node-api:3000']
        labels:
          service: 'node-api'
          component: 'backend'

  # ──────────────────────────────────────────────────────────────────────────
  # Python API (FastAPI)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'python-api'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['python-api:8888']
        labels:
          service: 'python-api'
          component: 'backend'

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          component: 'database'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: postgres-exporter:9187

  # ──────────────────────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          component: 'cache'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: redis-exporter:9121

  # ──────────────────────────────────────────────────────────────────────────
  # Nginx
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'
          component: 'proxy'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: nginx-prometheus-exporter:9113

  # ──────────────────────────────────────────────────────────────────────────
  # Cadvisor (Container metrics)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'container'

  # ──────────────────────────────────────────────────────────────────────────
  # Node Exporter for containers (via cAdvisor)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'container-metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'container-metrics'
    metrics_path: /metrics/cadvisor

  # ──────────────────────────────────────────────────────────────────────────
  # Blackbox Exporter (External endpoint probing)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://app.children-robot.com
          - https://api.children-robot.com/health/live
          - https://api.children-robot.com/health/ready
        labels:
          service: 'blackbox'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ──────────────────────────────────────────────────────────────────────────
  # Pushgateway (For batch jobs)
  # ──────────────────────────────────────────────────────────────────────────
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'pushgateway'